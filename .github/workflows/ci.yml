name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m src.data.generate_synthetic_data
      - run: python -m src.data.load_duckdb
      - run: python -m src.knowledge.generate_sources
      - run: pytest -q
      - run: python - <<'PY'
from src.evaluation.run_eval import run_eval, summarize_eval
rows = run_eval(lambda q: {"route": "mixed", "answer": "Texas sales grounded answer"})
print(rows)
print(summarize_eval(rows))
PY
